name: Laravel CI/CD

on:
  push:
    branches:
      - Dieynaba_Ba_librairie  # Assurez-vous que le nom correspond exactement à la branche

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: 🔄 Cloner le code
        uses: actions/checkout@v3

      - name: ⚙️ Installer PHP & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo, pdo_mysql

      - name: 📦 Installer les dépendances
        run: |
          composer install
          cp .env.example .env
          php artisan key:generate

      - name: 🧪 Lancer les tests (si tu en as)
        run: |
          php artisan migrate --force

      - name: 🐳 Construire l'image Docker
        run: |
          docker build -t monimage/laravel-librairie .
